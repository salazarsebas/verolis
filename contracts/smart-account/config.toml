# Soroban Smart Account Configuration
# OpenZeppelin Smart Account Contracts for Stellar

[account]
# Account identifier (will be generated on deployment)
address = ""

# Signature threshold for general operations
threshold = 2

# Signers configuration
# Support for Ed25519, P256, and secp256k1
[[account.signers]]
id = "signer-1"
type = "ed25519"
public_key = "GABC123..."  # Replace with actual public key
weight = 1

[[account.signers]]
id = "signer-2"
type = "ed25519"
public_key = "GDEF456..."  # Replace with actual public key
weight = 1

[[account.signers]]
id = "signer-3"
type = "ed25519"
public_key = "GGHI789..."  # Replace with actual public key
weight = 1

# Context Rules
# Define what operations are allowed under which conditions
[[account.context_rules]]
id = "rule-1"
description = "API Payment Rule"
scope = { contract = "*", function = "transfer" }
lifetime = { expires_at = 1735689600 }  # Unix timestamp
conditions = { signers = ["signer-1"], policies = ["spending-limit-daily"] }

[[account.context_rules]]
id = "rule-2"
description = "Contract Deployment Rule"
scope = { operation = "create_contract" }
lifetime = { expires_at = 1735689600 }
conditions = { signers = ["signer-1", "signer-2"], threshold = 2 }

# Policies
# Spending limits, time locks, and other constraints
[[account.policies]]
id = "spending-limit-daily"
type = "spending_limit"
config = { limit = "10000000000", period = "daily", asset = "USDC" }  # $10,000 daily

[[account.policies]]
id = "spending-limit-transaction"
type = "spending_limit"
config = { limit = "1000000000", period = "per_transaction", asset = "USDC" }  # $1,000 per tx

[[account.policies]]
id = "time-lock-high-value"
type = "time_lock"
config = { threshold = "50000000000", delay_seconds = 86400 }  # 24h delay for >$50k

# Network Configuration
[network]
rpc_url = "https://soroban-test.stellar.org:443"
network_passphrase = "Test SDF Network ; September 2015"
# For mainnet:
# rpc_url = "https://soroban-pub.stellar.org:443"
# network_passphrase = "Public Global Stellar Network ; September 2015"

# Deployment Configuration
[deployment]
soroban_token = "USDC"
initial_funding_xlm = "10"  # XLM for rent reserves
fee_sponsorship = true  # Enable fee sponsorship for gasless transactions
